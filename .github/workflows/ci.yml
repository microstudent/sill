name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: macOS build and tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Show toolchain
        run: swift --version
      - name: Test
        run: swift test
      - name: Package app
        env:
          CODE_SIGN_IDENTITY: "-"
        run: ./scripts/build-app.sh
      - name: Archive app bundle
        run: ditto -c -k --sequesterRsrc --keepParent build/Sill.app build/Sill-macos-${{ runner.arch }}.zip
      - name: Upload test build
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          path: build/Sill-macos-${{ runner.arch }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
